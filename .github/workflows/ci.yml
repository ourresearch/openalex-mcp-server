name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily: the bundled help pages must match help.openalex.org (npm run check-docs).
    - cron: "23 6 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Bundled docs match help.openalex.org
        run: npm run check-docs
